name: Release

on:
  push:
    branches: ["master"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      app_version: ${{ steps.version.outputs.app_version }}
    steps:
      - uses: actions/checkout@v7

      - name: Read version
        id: version
        run: |
          appv="$(sed -nE '/^\[workspace.package\]/,/^\[/ s/^version = "(.*)"$/\1/p' Cargo.toml)"
          echo "version=$appv"
          if [ -z "$appv" ]; then
            echo "::error::failed to read workspace version from Cargo.toml"
            exit 1
          fi
          echo "app_version=$appv" >> "$GITHUB_OUTPUT"

  windows:
    needs: guard
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked -p accountchanger

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: target/release/AccountChanger.exe
          if-no-files-found: error

  linux:
    needs: guard
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends pkg-config cmake libxkbcommon-x11-dev libwayland-dev libvulkan-dev libx11-xcb-dev libxcb1-dev libfontconfig-dev libfreetype-dev libasound2-dev

      - name: Build
        run: |
          cargo build --release --locked -p accountchanger
          mkdir -p out
          cp target/release/AccountChanger out/AccountChanger-linux-x86_64
          chmod 0755 out/AccountChanger-linux-x86_64

      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: out/AccountChanger-linux-x86_64
          if-no-files-found: error

  release:
    needs: [guard, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Check release notes
        run: |
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "::error::RELEASE_NOTES.md is empty or missing"
            exit 1
          fi
          if grep -qi "TODO" RELEASE_NOTES.md; then
            echo "::error::RELEASE_NOTES.md still contains TODO"
            exit 1
          fi

      - name: Checksums
        working-directory: dist
        run: sha256sum AccountChanger.exe AccountChanger-linux-x86_64 > checksums.txt

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.guard.outputs.app_version }}
          name: ${{ needs.guard.outputs.app_version }}
          target_commitish: ${{ github.sha }}
          body_path: RELEASE_NOTES.md
          files: |
            dist/AccountChanger.exe
            dist/AccountChanger-linux-x86_64
            dist/checksums.txt
          draft: false
          prerelease: false
          make_latest: true
